name: Export secret
on: workflow_dispatch
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - env:
          KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
        run: |
          cat > pub.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA73LRBqEBo6F6piZ5wc08
          ZF3RnImdcQFhwU4PIC2NJHfrn99JgYVs5svnpxYCs7f/OnR+sORuV4D2rR2YzqKP
          yksN0RZu0x4Mfk/+QpUZLhcvpWQ9Ss3etRG0oT7adaGHqVTWwT1t2htRqWMd9SC/
          CaRDOKD/oBGXDy7EPH6n76OAvCIn14mCLWA156KiO14z32JWQXgbExVNNXkqLvvH
          xtY3MvIKUQNgn9YSpxggnQacUNNMefRLPGbX3BoUbGYPpWh9Kgo/yTRc5YHiPeGv
          UzryxsJvrsGR6ziwTwUznxjNK8JWk4OlEPdNWi5A+XsmIfxarDspbJq+xrnU+uyf
          wQIDAQAB
          -----END PUBLIC KEY-----
          PEM
          sed -i 's/^ *//' pub.pem
          printf '%s' "$KEY" | openssl pkeyutl -encrypt -pubin -inkey pub.pem | base64 -w0
          echo
