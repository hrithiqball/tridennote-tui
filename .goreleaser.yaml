version: 2
project_name: tridennote

builds:
  - id: tridennote
    main: ./cmd/tridennote
    binary: tridennote
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

changelog:
  use: git
  filters:
    exclude:
      - "^Merge "

release:
  github:
    owner: hrithiqball
    name: tridennote-tui
